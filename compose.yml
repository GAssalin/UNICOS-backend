x-app: &app
  restart: unless-stopped
  networks: [unicos]
  env_file: ${ENV_FILE:?defina ENV_FILE}
  environment: &common-env
    SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-}
    SERVER_PORT: "8080"
    EUREKA_URL: http://service-registry:8081/eureka/
    EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://service-registry:8081/eureka/
    EUREKA_INSTANCE_PREFER_IP_ADDRESS: "true"
    MANAGEMENT_ENDPOINTS_WEB_EXPOSURE_INCLUDE: health,info
    MANAGEMENT_ENDPOINT_HEALTH_PROBES_ENABLED: "true"
  healthcheck: &app-health
    test: ["CMD-SHELL", "curl -fsS http://localhost:$${SERVER_PORT}/actuator/health >/dev/null || exit 1"]
    interval: 15s
    timeout: 5s
    retries: 12
    start_period: 60s

x-mysql: &mysql
  image: mysql:8.4
  restart: unless-stopped
  networks: [unicos]
  command: ["--character-set-server=utf8mb4", "--collation-server=utf8mb4_0900_ai_ci"]
  healthcheck:
    test: ["CMD-SHELL", "mysqladmin ping -h localhost -uroot -p$$MYSQL_ROOT_PASSWORD --silent"]
    interval: 10s
    timeout: 5s
    retries: 15
    start_period: 30s

services:
  # ===========================================================
  # Infraestrutura
  # ===========================================================
  service-registry:
    <<: *app
    build: { context: ., dockerfile: Dockerfile.service, args: { SERVICE_NAME: service-registry } }
    environment:
      <<: *common-env
      SERVER_PORT: "8081"
      EUREKA_CLIENT_REGISTER_WITH_EUREKA: "false"
      EUREKA_CLIENT_FETCH_REGISTRY: "false"

  gateway:
    <<: *app
    build: { context: ., dockerfile: Dockerfile.service, args: { SERVICE_NAME: gateway } }
    # Unico ponto de entrada publicado no host (por padrao apenas em 127.0.0.1).
    ports:
      - "${GATEWAY_BIND_ADDRESS:-127.0.0.1}:${GATEWAY_PORT:-8082}:8080"
    depends_on:
      service-registry: { condition: service_healthy }

  # Mensageria provisionada para uso futuro: nenhum servico a utiliza ainda.
  # Suba com: docker compose --profile mensageria ...
  rabbitmq:
    image: rabbitmq:4.1-management-alpine
    profiles: [mensageria]
    restart: unless-stopped
    networks: [unicos]
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-unicos}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:-}
    volumes: [rabbitmq_data:/var/lib/rabbitmq]
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s

  # ===========================================================
  # Bancos de dados (um por dominio)
  # ===========================================================
  mysql-pessoas:
    <<: *mysql
    environment:
      MYSQL_DATABASE: "${PESSOA_DB_NAME:?defina PESSOA_DB_NAME}"
      MYSQL_USER: "${PESSOA_DB_USER:?defina PESSOA_DB_USER}"
      MYSQL_PASSWORD: "${PESSOA_DB_PASSWORD:?defina PESSOA_DB_PASSWORD}"
      MYSQL_ROOT_PASSWORD: "${PESSOA_DB_PASSWORD:?defina PESSOA_DB_PASSWORD}"
    volumes: [mysql_pessoas_data:/var/lib/mysql]

  mysql-permissao:
    <<: *mysql
    environment:
      MYSQL_DATABASE: "${PERMISSAO_DB_NAME:?defina PERMISSAO_DB_NAME}"
      MYSQL_USER: "${PERMISSAO_DB_USER:?defina PERMISSAO_DB_USER}"
      MYSQL_PASSWORD: "${PERMISSAO_DB_PASSWORD:?defina PERMISSAO_DB_PASSWORD}"
      MYSQL_ROOT_PASSWORD: "${PERMISSAO_DB_PASSWORD:?defina PERMISSAO_DB_PASSWORD}"
    volumes: [mysql_permissao_data:/var/lib/mysql]

  mysql-empresa:
    <<: *mysql
    environment:
      MYSQL_DATABASE: "${EMPRESA_DB_NAME:?defina EMPRESA_DB_NAME}"
      MYSQL_USER: "${EMPRESA_DB_USER:?defina EMPRESA_DB_USER}"
      MYSQL_PASSWORD: "${EMPRESA_DB_PASSWORD:?defina EMPRESA_DB_PASSWORD}"
      MYSQL_ROOT_PASSWORD: "${EMPRESA_DB_PASSWORD:?defina EMPRESA_DB_PASSWORD}"
    volumes: [mysql_empresa_data:/var/lib/mysql]

  mysql-cliente:
    <<: *mysql
    environment:
      MYSQL_DATABASE: "${CLIENTE_DB_NAME:?defina CLIENTE_DB_NAME}"
      MYSQL_USER: "${CLIENTE_DB_USER:?defina CLIENTE_DB_USER}"
      MYSQL_PASSWORD: "${CLIENTE_DB_PASSWORD:?defina CLIENTE_DB_PASSWORD}"
      MYSQL_ROOT_PASSWORD: "${CLIENTE_DB_PASSWORD:?defina CLIENTE_DB_PASSWORD}"
    volumes: [mysql_cliente_data:/var/lib/mysql]

  mysql-estoque:
    <<: *mysql
    environment:
      MYSQL_DATABASE: "${ESTOQUE_DB_NAME:?defina ESTOQUE_DB_NAME}"
      MYSQL_USER: "${ESTOQUE_DB_USER:?defina ESTOQUE_DB_USER}"
      MYSQL_PASSWORD: "${ESTOQUE_DB_PASSWORD:?defina ESTOQUE_DB_PASSWORD}"
      MYSQL_ROOT_PASSWORD: "${ESTOQUE_DB_PASSWORD:?defina ESTOQUE_DB_PASSWORD}"
    volumes: [mysql_estoque_data:/var/lib/mysql]

  mysql-produto:
    <<: *mysql
    environment:
      MYSQL_DATABASE: "${PRODUTO_DB_NAME:?defina PRODUTO_DB_NAME}"
      MYSQL_USER: "${PRODUTO_DB_USER:?defina PRODUTO_DB_USER}"
      MYSQL_PASSWORD: "${PRODUTO_DB_PASSWORD:?defina PRODUTO_DB_PASSWORD}"
      MYSQL_ROOT_PASSWORD: "${PRODUTO_DB_PASSWORD:?defina PRODUTO_DB_PASSWORD}"
    volumes: [mysql_produto_data:/var/lib/mysql]

  # ===========================================================
  # Microsservicos
  # ===========================================================
  ms-autenticacao:
    <<: *app
    build: { context: ., dockerfile: Dockerfile.service, args: { SERVICE_NAME: ms-autenticacao } }
    depends_on:
      service-registry: { condition: service_healthy }
      ms-pessoas: { condition: service_healthy }

  ms-pessoas:
    <<: *app
    build: { context: ., dockerfile: Dockerfile.service, args: { SERVICE_NAME: ms-pessoas } }
    environment:
      <<: *common-env
      SPRING_DATASOURCE_URL: "jdbc:mysql://mysql-pessoas:3306/${PESSOA_DB_NAME}?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC"
      SPRING_DATASOURCE_USERNAME: "${PESSOA_DB_USER}"
      SPRING_DATASOURCE_PASSWORD: "${PESSOA_DB_PASSWORD}"
    depends_on:
      service-registry: { condition: service_healthy }
      mysql-pessoas: { condition: service_healthy }

  ms-permissao:
    <<: *app
    build: { context: ., dockerfile: Dockerfile.service, args: { SERVICE_NAME: ms-permissao } }
    environment:
      <<: *common-env
      SPRING_DATASOURCE_URL: "jdbc:mysql://mysql-permissao:3306/${PERMISSAO_DB_NAME}?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC"
      SPRING_DATASOURCE_USERNAME: "${PERMISSAO_DB_USER}"
      SPRING_DATASOURCE_PASSWORD: "${PERMISSAO_DB_PASSWORD}"
    depends_on:
      service-registry: { condition: service_healthy }
      mysql-permissao: { condition: service_healthy }

  ms-empresa:
    <<: *app
    build: { context: ., dockerfile: Dockerfile.service, args: { SERVICE_NAME: ms-empresa } }
    environment:
      <<: *common-env
      SPRING_DATASOURCE_URL: "jdbc:mysql://mysql-empresa:3306/${EMPRESA_DB_NAME}?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC"
      SPRING_DATASOURCE_USERNAME: "${EMPRESA_DB_USER}"
      SPRING_DATASOURCE_PASSWORD: "${EMPRESA_DB_PASSWORD}"
    depends_on:
      service-registry: { condition: service_healthy }
      mysql-empresa: { condition: service_healthy }

  ms-cliente:
    <<: *app
    build: { context: ., dockerfile: Dockerfile.service, args: { SERVICE_NAME: ms-cliente } }
    environment:
      <<: *common-env
      SPRING_DATASOURCE_URL: "jdbc:mysql://mysql-cliente:3306/${CLIENTE_DB_NAME}?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC"
      SPRING_DATASOURCE_USERNAME: "${CLIENTE_DB_USER}"
      SPRING_DATASOURCE_PASSWORD: "${CLIENTE_DB_PASSWORD}"
    depends_on:
      service-registry: { condition: service_healthy }
      mysql-cliente: { condition: service_healthy }

  ms-estoque:
    <<: *app
    build: { context: ., dockerfile: Dockerfile.service, args: { SERVICE_NAME: ms-estoque } }
    environment:
      <<: *common-env
      SPRING_DATASOURCE_URL: "jdbc:mysql://mysql-estoque:3306/${ESTOQUE_DB_NAME}?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC"
      SPRING_DATASOURCE_USERNAME: "${ESTOQUE_DB_USER}"
      SPRING_DATASOURCE_PASSWORD: "${ESTOQUE_DB_PASSWORD}"
    depends_on:
      service-registry: { condition: service_healthy }
      mysql-estoque: { condition: service_healthy }

  ms-produto:
    <<: *app
    build: { context: ., dockerfile: Dockerfile.service, args: { SERVICE_NAME: ms-produto } }
    environment:
      <<: *common-env
      SPRING_DATASOURCE_URL: "jdbc:mysql://mysql-produto:3306/${PRODUTO_DB_NAME}?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC"
      SPRING_DATASOURCE_USERNAME: "${PRODUTO_DB_USER}"
      SPRING_DATASOURCE_PASSWORD: "${PRODUTO_DB_PASSWORD}"
    depends_on:
      service-registry: { condition: service_healthy }
      mysql-produto: { condition: service_healthy }

networks:
  unicos: { driver: bridge }

volumes:
  rabbitmq_data:
  mysql_pessoas_data:
  mysql_permissao_data:
  mysql_empresa_data:
  mysql_cliente_data:
  mysql_estoque_data:
  mysql_produto_data:
