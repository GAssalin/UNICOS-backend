# Contexto de teste: H2 em memoria, sem Flyway (migracoes usam sintaxe MySQL) e sem Eureka.
spring.datasource.url=jdbc:h2:mem:unicos;MODE=MySQL;DB_CLOSE_DELAY=-1;DATABASE_TO_LOWER=TRUE
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver
spring.jpa.hibernate.ddl-auto=create-drop
spring.flyway.enabled=false
eureka.client.enabled=false
spring.cloud.discovery.enabled=false
jwt.secret=segredo-de-teste-com-mais-de-32-caracteres
jwt.issuer=unicos-teste
security.internal.token=token-interno-de-teste
