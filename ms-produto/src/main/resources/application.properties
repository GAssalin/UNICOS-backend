spring.application.name=ms-produto
spring.jpa.show-sql=true

# =========================================================
# Eureka
# =========================================================
eureka.client.register-with-eureka=true
eureka.client.fetch-registry=true
eureka.client.service-url.defaultZone=${EUREKA_URL:http://service-registry:8081/eureka/}
eureka.instance.instance-id=${spring.application.name}:${spring.application.instance_id:${random.value}}
eureka.instance.prefer-ip-address=true

# =========================================================
# Server
# =========================================================
server.port=${PRODUTO_SERVER_PORT:0}
server.error.include-stacktrace=never
server.error.include-message=always

# =========================================================
# SpringDoc
# =========================================================
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.disable-swagger-default-url=true

# =========================================================
# LOGS
# =========================================================
logging.level.org.springframework.security=INFO
logging.level.io.github.resilience4j=INFO
logging.level.org.springframework.cloud.client.circuitbreaker=INFO
logging.level.feign=INFO

# =========================================================
# OPENFEIGN - TIMEOUTS
# =========================================================

# =========================================================
# RESILIENCE4J - CONFIG BASE
# =========================================================

# =========================================================
# ACTUATOR / HEALTH
# =========================================================
management.health.circuitbreakers.enabled=true
management.endpoints.web.exposure.include=health,info,metrics,circuitbreakers
management.endpoint.health.show-details=always

jwt.secret=${UNICOS_JWT_SECRET}
jwt.issuer=${UNICOS_JWT_ISSUER}
jwt.tempo.exp.token=${UNICOS_TEMPO_EXP_TOKEN}

# Token usado para confiar apenas em chamadas encaminhadas pelo gateway.
security.internal.token=${UNICOS_INTERNAL_TOKEN}

# =========================================================
# BANCO
# =========================================================
spring.datasource.url=jdbc:mysql://${PRODUTO_DB_HOST}:${PRODUTO_DB_PORT}/${PRODUTO_DB_NAME}?createDatabaseIfNotExist=true&serverTimezone=UTC
spring.datasource.username=${PRODUTO_DB_USER}
spring.datasource.password=${PRODUTO_DB_PASSWORD}
spring.jpa.hibernate.ddl-auto=validate

spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration/common,classpath:db/migration/local

# =========================================================
# RABBITMQ / OUTBOX
# =========================================================
spring.rabbitmq.host=${RABBITMQ_HOST}
spring.rabbitmq.port=${RABBITMQ_PORT}
spring.rabbitmq.username=${RABBITMQ_USER}
spring.rabbitmq.password=${RABBITMQ_PASSWORD}

spring.rabbitmq.listener.simple.retry.enabled=true
spring.rabbitmq.listener.simple.retry.max-attempts=3
spring.rabbitmq.listener.simple.retry.initial-interval=1000
spring.rabbitmq.listener.simple.retry.multiplier=2
spring.rabbitmq.listener.simple.retry.max-interval=10000
spring.rabbitmq.listener.simple.default-requeue-rejected=false

# Tempo aguardado depois do fim de uma consulta da Outbox.
outbox.publicacao.intervalo-ms=${OUTBOX_INTERVALO_MS:2000}
