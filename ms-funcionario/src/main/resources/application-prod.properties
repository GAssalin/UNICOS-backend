logging.level.org.springframework.security=WARN
management.endpoint.health.show-details=never
server.error.include-message=never
spring.jpa.show-sql=false

# Nunca aplicar os dados de desenvolvimento (db/migration/local) fora do ambiente local.
spring.flyway.locations=classpath:db/migration/common,classpath:db/migration/prod

# Documentacao OpenAPI desligada em producao: expoe o mapa completo da API.
springdoc.api-docs.enabled=false
springdoc.swagger-ui.enabled=false
