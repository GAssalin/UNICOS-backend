spring.application.name=ms-autenticacao
# Nao ha usuarios locais: a autenticacao e feita contra o ms-pessoas.
spring.autoconfigure.exclude=org.springframework.boot.autoconfigure.security.servlet.UserDetailsServiceAutoConfiguration

# =========================================================
# Eureka
# =========================================================
eureka.client.register-with-eureka=true
eureka.client.fetch-registry=true
eureka.client.service-url.defaultZone=${EUREKA_URL:http://service-registry:8081/eureka/}
eureka.instance.instance-id=${spring.application.name}:${spring.application.instance_id:${random.value}}
eureka.instance.prefer-ip-address=true

# =========================================================
# Server
# =========================================================
server.port=${AUTH_SERVER_PORT:0}
server.error.include-stacktrace=never
server.error.include-message=always

# =========================================================
# SpringDoc
# =========================================================
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.disable-swagger-default-url=true

# =========================================================
# LOGS
# =========================================================
logging.level.org.springframework.security=INFO
logging.level.io.github.resilience4j=INFO
logging.level.org.springframework.cloud.client.circuitbreaker=INFO
logging.level.feign=INFO

# =========================================================
# OPENFEIGN - TIMEOUTS
# =========================================================
spring.cloud.openfeign.client.config.default.connect-timeout=2000
spring.cloud.openfeign.client.config.default.read-timeout=5000
spring.cloud.openfeign.client.config.default.logger-level=basic

# =========================================================
# RESILIENCE4J
# =========================================================
# Erros 4xx (ex.: usuario inexistente) nao indicam indisponibilidade e nao abrem o circuito.
resilience4j.circuitbreaker.configs.default.ignore-exceptions=feign.FeignException$FeignClientException
resilience4j.circuitbreaker.instances.ms-pessoas.base-config=default
resilience4j.circuitbreaker.instances.ms-pessoas.sliding-window-size=10
resilience4j.circuitbreaker.instances.ms-pessoas.minimum-number-of-calls=5
resilience4j.circuitbreaker.instances.ms-pessoas.failure-rate-threshold=50
resilience4j.circuitbreaker.instances.ms-pessoas.wait-duration-in-open-state=10s
resilience4j.circuitbreaker.instances.ms-pessoas.permitted-number-of-calls-in-half-open-state=2

# =========================================================
# ACTUATOR / HEALTH
# =========================================================
management.health.circuitbreakers.enabled=true
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=never
management.endpoint.health.probes.enabled=true

# =========================================================
# JWT
# =========================================================
jwt.secret=${UNICOS_JWT_SECRET}
jwt.issuer=${UNICOS_JWT_ISSUER}
# Tempos de expiracao em minutos.
jwt.tempo.exp.token=${UNICOS_TEMPO_EXP_TOKEN:15}
jwt.tempo.exp.refresh.token=${UNICOS_TEMPO_EXP_REFRESH_TOKEN:1440}

# Segredo enviado nas chamadas internas (Feign) ao ms-pessoas.
security.internal.token=${UNICOS_INTERNAL_TOKEN}
