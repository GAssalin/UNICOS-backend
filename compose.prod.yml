# Override de producao: profile "prod", filesystem somente leitura, limites de
# recursos e rotacao de logs. O Gateway continua sendo o unico servico publicado
# (definido no compose.yml).
x-prod: &prod
  read_only: true
  tmpfs:
    - /tmp
  security_opt:
    - no-new-privileges:true
  logging:
    driver: json-file
    options:
      max-size: 10m
      max-file: "3"
  deploy:
    resources:
      limits:
        memory: 768M
        cpus: "1.0"
      reservations:
        memory: 256M

x-prod-env: &prod-env
  SPRING_PROFILES_ACTIVE: prod

services:
  service-registry: { <<: *prod, environment: { <<: *prod-env } }
  gateway: { <<: *prod, environment: { <<: *prod-env } }
  ms-autenticacao: { <<: *prod, environment: { <<: *prod-env } }
  ms-pessoas: { <<: *prod, environment: { <<: *prod-env } }
  ms-permissao: { <<: *prod, environment: { <<: *prod-env } }
  ms-empresa: { <<: *prod, environment: { <<: *prod-env } }
  ms-cliente: { <<: *prod, environment: { <<: *prod-env } }
  ms-funcionario: { <<: *prod, environment: { <<: *prod-env } }
  ms-estoque: { <<: *prod, environment: { <<: *prod-env } }
  ms-produto: { <<: *prod, environment: { <<: *prod-env } }
