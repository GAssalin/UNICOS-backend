services:
  service-registry:
    read_only: true
    tmpfs:
    - /tmp
    security_opt:
    - no-new-privileges:true
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: '3'
    deploy:
      resources:
        limits:
          memory: 768M
          cpus: '1.0'
        reservations:
          memory: 256M
    environment:
      SPRING_PROFILES_ACTIVE: prod
  gateway:
    read_only: true
    tmpfs:
    - /tmp
    security_opt:
    - no-new-privileges:true
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: '3'
    deploy:
      resources:
        limits:
          memory: 768M
          cpus: '1.0'
        reservations:
          memory: 256M
    environment:
      SPRING_PROFILES_ACTIVE: prod
    ports:
    - ${GATEWAY_BIND_ADDRESS:-127.0.0.1}:${GATEWAY_PORT:-8082}:8080
  ms-autenticacao:
