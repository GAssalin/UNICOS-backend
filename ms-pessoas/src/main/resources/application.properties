spring.application.name=ms-pessoas
# A autenticacao e feita pelo JWT (ContextoRequisicaoFilter); nao ha usuarios em memoria.
spring.autoconfigure.exclude=org.springframework.boot.autoconfigure.security.servlet.UserDetailsServiceAutoConfiguration

# =========================================================
# Eureka
# =========================================================
eureka.client.register-with-eureka=true
eureka.client.fetch-registry=true
eureka.client.service-url.defaultZone=${EUREKA_URL:http://service-registry:8081/eureka/}
eureka.instance.instance-id=${spring.application.name}:${spring.application.instance_id:${random.value}}
eureka.instance.prefer-ip-address=true

# =========================================================
# Server
# =========================================================
server.port=${PESSOA_SERVER_PORT:0}
server.error.include-stacktrace=never
server.error.include-message=always

# =========================================================
# SpringDoc
# =========================================================
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.disable-swagger-default-url=true

# =========================================================
# LOGS
# =========================================================
logging.level.org.springframework.security=INFO
logging.level.io.github.resilience4j=INFO
logging.level.org.springframework.cloud.client.circuitbreaker=INFO
logging.level.feign=INFO

# =========================================================
# OPENFEIGN - TIMEOUTS
# =========================================================
spring.cloud.openfeign.client.config.default.connect-timeout=2000
spring.cloud.openfeign.client.config.default.read-timeout=5000

# =========================================================
# RESILIENCE4J
# =========================================================
# Erros 4xx do servico chamado nao indicam indisponibilidade e nao abrem o circuito.
resilience4j.circuitbreaker.configs.default.ignore-exceptions=feign.FeignException$FeignClientException

# =========================================================
# ACTUATOR / HEALTH
# =========================================================
management.health.circuitbreakers.enabled=true
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=never
management.endpoint.health.probes.enabled=true

# =========================================================
# SEGURANCA
# =========================================================
# Mesmos valores do emissor dos tokens (ms-autenticacao).
jwt.secret=${UNICOS_JWT_SECRET}
jwt.issuer=${UNICOS_JWT_ISSUER}

# Segredo exigido nos endpoints /internal/** e enviado nas chamadas Feign.
security.internal.token=${UNICOS_INTERNAL_TOKEN}

# =========================================================
# BANCO
# =========================================================
spring.datasource.url=jdbc:mysql://${PESSOA_DB_HOST}:${PESSOA_DB_PORT}/${PESSOA_DB_NAME}?createDatabaseIfNotExist=true&serverTimezone=UTC
spring.datasource.username=${PESSOA_DB_USER}
spring.datasource.password=${PESSOA_DB_PASSWORD}
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false

# Estrutura (common) + dados de desenvolvimento (local). Homologacao e producao
# substituem "local" pela pasta do ambiente nos respectivos profiles.
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration/common,classpath:db/migration/local
