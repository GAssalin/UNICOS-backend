name: unicos

x-common-env: &common-env
  # Eureka / Discovery
  EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: ${EUREKA_URL}

  # JWT
  UNICOS_JWT_SECRET: ${UNICOS_JWT_SECRET}
  UNICOS_JWT_ISSUER: ${UNICOS_JWT_ISSUER}
  UNICOS_TEMPO_EXP_TOKEN: ${UNICOS_TEMPO_EXP_TOKEN}
  UNICOS_TEMPO_EXP_REFRESH_TOKEN: ${UNICOS_TEMPO_EXP_REFRESH_TOKEN}

  # Email
  EMAIL_USERNAME: ${EMAIL_USERNAME}
  EMAIL_PASSWORD: ${EMAIL_PASSWORD}

  # DB credenciais (para Spring)
  SPRING_DATASOURCE_USERNAME: ${DB_USER}
  SPRING_DATASOURCE_PASSWORD: ${DB_PASSWORD}cls

  # Config repo (se seu config-server usa isso)
  CONFIG_REPO_URI: ${CONFIG_REPO_URI}
  CONFIG_REPO_USER: ${CONFIG_REPO_USER}
  CONFIG_REPO_PASSWORD: ${CONFIG_REPO_PASSWORD}

x-ms-depends: &ms-depends
  config-server:
    condition: service_healthy
  service-registry:
    condition: service_healthy

x-ms-db-depends: &ms-db-depends
  config-server:
    condition: service_healthy
  service-registry:
    condition: service_healthy
  mysql:
    condition: service_healthy

x-java-hardening: &java-hardening
  security_opt:
    - no-new-privileges:true
  cap_drop:
    - ALL

services:
  mysql:
    image: mysql:8.4
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -uroot -p$${MYSQL_ROOT_PASSWORD}"]
      interval: 10s
      timeout: 5s
      retries: 10
    volumes:
      - mysql_data:/var/lib/mysql
    networks:
      - unicos-net

  config-server:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        SERVICE_DIR: config-server
    container_name: config-server
    environment:
      URI: ${CONFIG_REPO_URI}
      USER_GIT: ${CONFIG_REPO_USER}
      PASSWORD_GIT: ${CONFIG_REPO_PASSWORD}
    ports:
      - "8888:8888"
    depends_on: {}
    healthcheck:
      test: [ "CMD-SHELL", "wget -qO- http://localhost:8888/actuator/health | grep UP || exit 1" ]
      interval: 15s
      timeout: 5s
      retries: 10
    <<: *java-hardening
    networks:
      - unicos-net

  service-registry:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        SERVICE_DIR: service-registry
    container_name: service-registry
    depends_on:
      config-server:
        condition: service_healthy
    ports:
      - "8081:8081"
    healthcheck:
      test: [ "CMD-SHELL", "wget -qO- http://localhost:8081/actuator/health | grep UP || exit 1" ]
      interval: 15s
      timeout: 5s
      retries: 10
    <<: *java-hardening
    networks:
      - unicos-net

  gateway:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        SERVICE_DIR: gateway
    container_name: gateway
    environment:
      <<: *common-env
    depends_on:
      config-server:
        condition: service_healthy
      service-registry:
        condition: service_healthy
    ports:
      - "8082:8082"
    healthcheck:
      test: [ "CMD-SHELL", "wget -qO- http://localhost:8082/actuator/health | grep UP || exit 1" ]
      interval: 15s
      timeout: 5s
      retries: 10
    <<: *java-hardening
    networks:
      - unicos-net

  ms-autenticacao:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        SERVICE_DIR: ms-autenticacao
    environment:
      <<: *common-env
      SPRING_DATASOURCE_URL: jdbc:mysql://${DB_HOST}:${DB_PORT}/${DB_NAME_AUTENTICACAO}?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
    depends_on: *ms-db-depends
    <<: *java-hardening
    networks:
      - unicos-net

  ms-compras:
