spring.application.name=gateway
server.port=${SERVER_PORT:8082}
spring.main.web-application-type=reactive

# Eureka continua responsavel pela descoberta usada nas rotas lb://.
eureka.client.register-with-eureka=true
eureka.client.fetch-registry=true
eureka.client.service-url.defaultZone=${EUREKA_URL:http://localhost:8081/eureka/}
eureka.instance.instance-id=${spring.application.name}:${spring.application.instance_id:${random.value}}
eureka.instance.prefer-ip-address=true

# As rotas e seus filtros JWT sao definidos em GatewayConfig.
spring.cloud.gateway.server.webflux.discovery.locator.enabled=false

# Usar os MESMOS valores do emissor dos tokens (ms-autenticacao).
jwt.secret=${UNICOS_JWT_SECRET}
jwt.issuer=${UNICOS_JWT_ISSUER}

management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=never
logging.level.org.springframework.cloud.gateway=INFO
