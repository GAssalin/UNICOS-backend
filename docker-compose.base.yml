name: unicos-base

services:
  mysql:
    image: mysql:8.4
    container_name: mysql
    environment:
      MYSQL_USERNAME: ${DB_USER}
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD}
      MYSQL_ROOT_HOST: "%"
    ports:
      - "3307:3306"
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -uroot -p$${MYSQL_ROOT_PASSWORD}"]
      interval: 10s
      timeout: 5s
      retries: 10
    volumes:
      - mysql_data:/var/lib/mysql
    networks:
      - unicos-net

  config-server:
    build:
      context: ./config-server
      dockerfile: Dockerfile
    container_name: config-server
    environment:
      SERVER_PORT: 8888
      SPRING_CLOUD_CONFIG_SERVER_GIT_URI: ${CONFIG_REPO_URI}
      SPRING_CLOUD_CONFIG_SERVER_GIT_USERNAME: ${CONFIG_REPO_USER}
      SPRING_CLOUD_CONFIG_SERVER_GIT_PASSWORD: ${CONFIG_REPO_PASSWORD}
    ports:
      - "8888:8888"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8888/actuator/health | grep UP || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 10
    networks:
      - unicos-net

  service-registry:
    build:
      context: ./service-registry
      dockerfile: Dockerfile
    container_name: service-registry
    environment:
      SERVER_PORT: 8081
      SPRING_CONFIG_IMPORT: optional:configserver:${SPRING_CONFIG_SERVER_URL}
      SPRING_CLOUD_CONFIG_URI: ${SPRING_CONFIG_SERVER_URL}
      EUREKA_URL: ${EUREKA_URL}
    depends_on:
      config-server:
        condition: service_healthy
    ports:
      - "8081:8081"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8081/actuator/health | grep UP || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 10
    networks:
      - unicos-net

  gateway:
    build:
      context: .
      dockerfile: ./gateway/Dockerfile
    container_name: gateway
    environment:
      SERVER_PORT: 8082
      SPRING_CONFIG_IMPORT: optional:configserver:${SPRING_CONFIG_SERVER_URL}
      SPRING_CLOUD_CONFIG_URI: ${SPRING_CONFIG_SERVER_URL}
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: ${EUREKA_URL}

      UNICOS_JWT_SECRET: ${UNICOS_JWT_SECRET}
      UNICOS_JWT_ISSUER: ${UNICOS_JWT_ISSUER}
      UNICOS_TEMPO_EXP_TOKEN: ${UNICOS_TEMPO_EXP_TOKEN}
      UNICOS_TEMPO_EXP_REFRESH_TOKEN: ${UNICOS_TEMPO_EXP_REFRESH_TOKEN}

      EMAIL_USERNAME: ${EMAIL_USERNAME}
      EMAIL_PASSWORD: ${EMAIL_PASSWORD}
    depends_on:
      config-server:
        condition: service_healthy
      service-registry:
        condition: service_healthy
    ports:
      - "8082:8082"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8082/actuator/health | grep UP || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 10
    networks:
      - unicos-net

networks:
  unicos-net:
    name: unicos-net
    driver: bridge

volumes:
  mysql_data:
    name: mysql_data